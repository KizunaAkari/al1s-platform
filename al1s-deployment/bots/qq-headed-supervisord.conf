[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/al1s-qq-supervisor.pid
childlogdir=/tmp

[program:llbot]
command=python -m al1s.bots.qq_headed.pmhq_process llbot
directory=/app/llbot
autostart=true
autorestart=unexpected
startsecs=0
startretries=3
exitcodes=0,78
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:meme-backend]
command=python -m al1s.meme_workshop.runtime_main
directory=/opt/al1s
autostart=true
autorestart=unexpected
startsecs=0
startretries=3
exitcodes=0,78
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xvfb]
command=Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX -noreset -dpi 96 -nolisten tcp
priority=10
autorestart=false
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:pmhq]
command=python -m al1s.bots.qq_headed.pmhq_process
directory=/opt
priority=20
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
