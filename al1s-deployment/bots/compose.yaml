name: al1s-bot

x-meme-runtime: &meme-runtime
  AL1S_MEME_BACKEND_TOKEN: ${AL1S_MEME_BACKEND_TOKEN:-}
  AL1S_MEME_DATABASE_URL: ${AL1S_MEME_DATABASE_URL:-}
  AL1S_MEME_MASTER_KEY: ${AL1S_MEME_MASTER_KEY:-}
  AL1S_MEME_S3_ENDPOINT_URL: ${AL1S_MEME_S3_ENDPOINT_URL:-http://al1s-platform-storage-s3:8333}
  AL1S_MEME_S3_BUCKET: ${AL1S_MEME_S3_BUCKET:-al1s-platform}
  AL1S_MEME_S3_ACCESS_KEY: ${AL1S_MEME_S3_ACCESS_KEY:-}
  AL1S_MEME_S3_SECRET_KEY: ${AL1S_MEME_S3_SECRET_KEY:-}

x-retained-syslog: &retained-syslog
  driver: syslog
  options:
    syslog-address: udp://host.docker.internal:15144
    syslog-format: rfc5424micro
    tag: "al1s/{{.Name}}"
    cache-disabled: "true"

services:
  llbot:
    image: ${AL1S_QQ_BOT_IMAGE:?set verified complete QQ image}
    container_name: al1s-bot-qq
    logging: *retained-syslog
    restart: unless-stopped
    init: true
    environment:
      <<: *meme-runtime
      AL1S_MEME_ROLE: qq
      TZ: Asia/Shanghai
      WEBUI_PORT: 3080
      AUTO_LOGIN_QQ: ${AUTO_LOGIN_QQ:-}
      PROTOCOL_MODE: ${AL1S_QQ_PROTOCOL_MODE:-direct}
      # QQ has its own egress setting; an empty value keeps LLBot direct.
      HTTP_PROXY: ${AL1S_QQ_HTTP_PROXY:-}
      HTTPS_PROXY: ${AL1S_QQ_HTTP_PROXY:-}
      NODE_USE_ENV_PROXY: "1"
      NO_PROXY: ${AL1S_BOT_NO_PROXY:-localhost,127.0.0.1,backend,al1s-platform-app,al1s-llbot}
    volumes:
      - ./llbot-data:/app/llbot/data:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      bot-network:
        aliases: [al1s-llbot]
      control-network:
        aliases: [al1s-llbot]
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - al1s.meme_workshop.healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  discord-worker:
    build:
      context: ../../backend
      dockerfile: al1s-bot/Dockerfile
    image: ${AL1S_DISCORD_WORKER_IMAGE:-al1s-plachta:local}
    container_name: al1s-bot-discord
    logging: *retained-syslog
    restart: unless-stopped
    init: true
    environment:
      <<: *meme-runtime
      AL1S_MEME_ROLE: discord
      TZ: Asia/Shanghai
      AL1S_CONTROL_BASE_URL: ${AL1S_CONTROL_BASE_URL:-http://backend:8000}
      AL1S_BOT_STATE_DIR: /var/lib/al1s-plachta
      AL1S_BOT_CREDENTIAL_PATH: /var/lib/al1s-plachta/credential
      AL1S_BOT_REGISTRATION_CODE_PATH: /var/lib/al1s-plachta/registration-code
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 3100
      AL1S_BOT_HTTP_PROXY: ${AL1S_BOT_HTTP_PROXY:-}
      AL1S_BOT_NO_PROXY: ${AL1S_BOT_NO_PROXY:-localhost,127.0.0.1,backend,al1s-platform-app,al1s-llbot}
    volumes:
      - discord-worker-state:/var/lib/al1s-plachta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      bot-network:
        aliases: [al1s-discord-worker]
      control-network:
        aliases: [al1s-discord-worker]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s

networks:
  bot-network:
    name: al1s-bot-network
    driver: bridge
  control-network:
    external: true
    name: ${AL1S_CONTROL_NETWORK:-al1s-platform-smoke-control}

volumes:
  discord-worker-state:
    name: al1s-next-discord-worker-state
