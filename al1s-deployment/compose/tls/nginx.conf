server {
    listen 8443 ssl;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream backend:8000;
    set $s3_upstream seaweed-s3:8333;

    ssl_certificate /etc/al1s/tls/server.crt;
    ssl_certificate_key /etc/al1s/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AL1S_TLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 5g;

    location ^~ /al1s-platform/ {
        proxy_pass http://$s3_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
    }

    # Bounded read-only archive export; do not extend every API's timeout.
    location ~ ^/api/v1/maa/(strategies/[^/]+/archive|scripts/[^/]+/versions/[^/]+/archive)$ {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 190s;
    }

    # Same-origin editor channels: authentication and fixed upstream selection are in the API.
    location ~ ^/api/v1/editor-sessions/[0-9a-fA-F-]+/channels/(video|control|screenshot)$ {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}

# Local browser entry for the unmodified LLOneBot WebUI. It uses root-relative
# assets, API requests and WebSockets, so it needs its own origin and root path.
server {
    listen 8444 ssl;
    server_name localhost 127.0.0.1;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $llbot_upstream al1s-llbot:3080;

    ssl_certificate /etc/al1s/tls/server.crt;
    ssl_certificate_key /etc/al1s/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://$llbot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
