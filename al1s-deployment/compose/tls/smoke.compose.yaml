services:
  frontend-smoke:
    image: m.daocloud.io/docker.io/library/nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    networks: [tls-smoke]

  https-smoke:
    image: m.daocloud.io/docker.io/library/nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    depends_on: [frontend-smoke]
    volumes:
      - ./nginx-smoke.conf:/etc/nginx/conf.d/default.conf:ro
      - ./generated:/etc/al1s/tls:ro
    ports:
      - "127.0.0.1:${AL1S_TLS_SMOKE_HTTPS_PORT:-18443}:8443"
    networks: [tls-smoke]

  mqtt-smoke:
    image: m.daocloud.io/docker.io/library/eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
    volumes:
      - ./mosquitto-smoke.conf:/mosquitto/config/mosquitto.conf:ro
      - ./generated:/mosquitto/certs:ro
    ports:
      - "127.0.0.1:${AL1S_TLS_SMOKE_MQTT_PORT:-18884}:8883"
    networks: [tls-smoke]

networks:
  tls-smoke: {}
