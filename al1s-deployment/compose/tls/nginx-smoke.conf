server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/al1s/tls/server.crt;
    ssl_certificate_key /etc/al1s/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://frontend-smoke:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
