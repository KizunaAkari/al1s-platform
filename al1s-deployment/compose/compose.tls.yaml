services:
  mosquitto:
    volumes:
      - ./tls/generated/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./tls/generated/server.crt:/mosquitto/certs/server.crt:ro
      - ./tls/generated/server.key:/mosquitto/certs/server.key:ro
    ports:
      - "${AL1S_MQTT_TLS_BIND_ADDRESS:-0.0.0.0}:${AL1S_MQTT_PUBLIC_PORT:-8883}:8883"

  backend:
    environment:
      AL1S_MQTT_PUBLIC_PORT: ${AL1S_MQTT_PUBLIC_PORT:-8883}
      AL1S_MQTT_PUBLIC_TLS_ENABLED: "true"

  tls-gateway:
    image: m.daocloud.io/docker.io/library/nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 12
    volumes:
      - ./tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/generated/server.crt:/etc/al1s/tls/server.crt:ro
      - ./tls/generated/server.key:/etc/al1s/tls/server.key:ro
    ports:
      - "${AL1S_HTTPS_BIND_ADDRESS:-0.0.0.0}:${AL1S_HTTPS_PUBLIC_PORT:-8443}:8443"
    networks: [control]
    restart: unless-stopped
