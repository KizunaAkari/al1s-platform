[unix_http_server]
file=/run/al1s/supervisor.sock
chmod=0600

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/al1s/supervisord.pid
childlogdir=/run/al1s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/al1s/supervisor.sock

[program:api]
command=uvicorn al1s.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:events]
command=python -m al1s.infrastructure.worker
directory=/app
autostart=true
