[unix_http_server]
file=/tmp/al1s-ops/supervisor.sock
chmod=0600
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/al1s-ops/supervisord.pid
childlogdir=/tmp/al1s-ops
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///tmp/al1s-ops/supervisor.sock
[program:maintenance]
command=python -m al1s.components.host --config "%(ENV_AL1S_COMPONENT_CONFIG)s"
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
stopwaitsecs=390
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:bot-control]
command=uvicorn al1s.bots.control_proxy:from_environment --factory --host 0.0.0.0 --port 8011 --workers 1 --no-access-log
directory=/app
autostart=true
autorestart=unexpected
startsecs=3
stopwaitsecs=75
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
