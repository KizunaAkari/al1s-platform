[unix_http_server]
file=/run/al1s-storage/supervisor.sock
chmod=0600
[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/al1s-storage/supervisord.pid
childlogdir=/tmp
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///run/al1s-storage/supervisor.sock
[program:master]
command=/usr/bin/weed master -ip=seaweed-master -mdir=/data/master
directory=/data/master
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:volume]
command=/usr/bin/weed volume -mserver=seaweed-master:9333 -ip=seaweed-volume -port=8080 -dir=/data/volume
directory=/data/volume
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:filer]
command=/usr/bin/weed filer -master=seaweed-master:9333
directory=/data/filer
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:s3]
command=/usr/bin/weed s3 -filer=seaweed-filer:8888 -port=8333 -config=/tmp/al1s-s3.json
directory=/data/s3
priority=40
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
