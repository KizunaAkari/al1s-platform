services:
  control-center:
    build:
      context: .
      dockerfile: Dockerfile
    image: maa-test-platform:demo
    container_name: maa-test-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: maa-test-platform
      DATABASE_PATH: /app/data/control-center.db
      AGENT_TOKEN: ${AGENT_TOKEN:-maa-demo-token}
      HEARTBEAT_TIMEOUT_SECONDS: 45
      STORAGE_WARNING_GB: ${STORAGE_WARNING_GB:-5}
      MAINTENANCE_INTERVAL_SECONDS: 15
      TZ: Asia/Shanghai
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      TERMINAL_DEPLOY_PUBLIC_URL: ${TERMINAL_DEPLOY_PUBLIC_URL:-${PUBLIC_BASE_URL:-http://127.0.0.1:8000}}
      TERMINAL_DEPLOYER_PORT: ${TERMINAL_DEPLOYER_PORT:-8767}
      TERMINAL_IMAGE_TAG: ${TERMINAL_IMAGE_TAG:-al1s-terminal-agent:npu-arm64}
      NOTIFICATION_KEY_PATH: /app/data/notification.key
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      FAILURE_EMAIL_TO: ${FAILURE_EMAIL_TO:-}
    volumes:
      - maa-platform-data:/app/data

volumes:
  maa-platform-data:
    name: maa-platform-data
