[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/al1s-bot-supervisor.pid
childlogdir=/tmp

[program:discord]
command=node --enable-source-maps /app/dist/index.js
directory=/app
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:meme-backend]
command=python -m al1s.meme_workshop.runtime_main
directory=/opt/al1s
autostart=true
autorestart=unexpected
startsecs=0
startretries=3
exitcodes=0,78
stopsignal=TERM
stopwaitsecs=25
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
