[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "al1s-platform-backend"
version = "0.1.0"
description = "AL-1S platform API and infrastructure boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "cryptography>=46,<47",
  "fastapi==0.141.1",
  "paho-mqtt==2.1.0",
  "OpenCC==1.4.2",
  "Pillow==12.3.0",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy==2.0.52",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=17.1,<18",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["al1s*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: requires the isolated AL-1S PostgreSQL test database",
  "contract: requires an external adapter implementation",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "paho.*"]
ignore_missing_imports = true
